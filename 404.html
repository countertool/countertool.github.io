<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.png" />
    <title>Counting Tool - 404</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #434445;
            color: #111827;
            padding: 20px;
        }

        .content {
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        .content h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 16px;
            color: white;
        }

        .content p {
            font-size: 1.125rem;
            color: white;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .btn-primary:hover {
            background-color: #e2e8f0;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #494b4d;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background-color: #404040;
            transform: translateY(-1px);
        }

        .btn:active {
        transform: scale(0.95);
        }

    </style>
</head>
<body>

    <main class="content">
        <h1>Page Not Found!</h1>
        <p>The page you were looking for wasn't found!</p>
        
        <div class="button-group">
            <a href="https://countertool.github.io/" target="_self" class="btn btn-primary">Return to Homepage</a>
        </div>
    </main>

</body>
  </html>
