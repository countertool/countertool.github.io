<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.png" />
    <title>Counting Tool</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #3d3d3d;
            color: #ffffff;
            font-family: system-ui;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 1px;
            width: 100%;
            max-width: 100%;
            padding: 5px;
        }

        .btn {
            width: 100%;
            height: 60px;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-plus {
            background-color: transparent;
            color: #2e7d32;
        }

        .btn-minus {
            background-color: transparent;
            color: #c62828;
        }

        .number {
            width: 130px;
            height: 130px;
            background-color: transparent;
            border: 2px solid transparent;
            border-radius: 0px;
            color: #ffffff;
            font-size: 110px;
            font-weight: bold;
            text-align: center;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .counter-box {
            border: 2px solid #4caf50;
            border-radius: 12px;
            display: flex;
            width: 90%;
            max-width: 420px;
            align-items: center;
            flex-direction: column;
        }

        .hr {
            border: 1.5px solid white;
            border-top: 1px single white;
            color: whitesmoke;
            overflow: visible;
            text-align: center;
            height: 1px;
            width: 90%;
        }

    </style>
</head>
<body>
    <div class="counter-box">
        <p class="number" id="numBox">|</p><hr class="hr">
        <div class="container">
            <button type="button" class="btn btn-plus" id="plus">
                <svg width="60px" height="60px" viewBox="0 0 24.00 24.00" fill="none" xmlns="http://www.w3.org/2000/svg" transform="rotate(0)">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier"> 
                        <path d="M9 12H15" stroke="#2e7d32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> 
                        <path d="M12 9L12 15" stroke="#2e7d32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> 
                        <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="#2e7d32" stroke-width="2"></path> 
                    </g>
                </svg>
            </button>
            <button type="button" class="btn btn-minus" id="minus">
                <svg width="60px" height="60px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier"> 
                        <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="#c62828" stroke-width="2"></path> 
                        <path d="M9 12H15" stroke="#c62828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> 
                    </g>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const input = document.getElementById('numBox');
        const plusBtn = document.getElementById('plus');
        const minusBtn = document.getElementById('minus');
        const tickSound = new Audio('/tick.mp3');

        function playTick() {
            tickSound.currentTime = 0;
            tickSound.play().catch(() => {});
        }

        function updateUrl(val) {
            const url = new URL(window.location);
            url.searchParams.set('number', val);
            window.history.replaceState({}, '', url);
        }

        function setValue(val) {
            input.textContent = val;
            updateUrl(val);
        }

        function init() {
            const params = new URLSearchParams(window.location.search);
            const num = params.get('number');
            if (num !== null && /^-?\d+$/.test(num)) {
                input.textContent = num;
            } else {
                setValue(0);
            }
        }

        plusBtn.addEventListener('click', () => {
            playTick();
            let curr = parseInt(input.textContent, 10);
            if (isNaN(curr)) curr = 0;
            setValue(curr + 1);
        });

        minusBtn.addEventListener('click', () => {
            playTick();
            let curr = parseInt(input.textContent, 10);
            if (isNaN(curr)) curr = 0;
            setValue(curr - 1);
        });

        init();
    </script>
  </body>
</html>
